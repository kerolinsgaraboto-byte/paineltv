<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Painel Institucional — Matrículas 2026</title>
<script>
/* #####################################################################
   COMO EDITAR OS DADOS

   JEITO FÁCIL (sem código): abra o painel no navegador do computador
   ou celular com  ?editar  no fim do endereço. Exemplo:
       https://seu-painel.netlify.app/?editar
   Um editor aparece ao lado do painel. Altere os números, confira o
   resultado ao vivo e clique em "Baixar HTML atualizado". Depois é só
   substituir o arquivo na hospedagem.

   JEITO DIRETO: altere os números no bloco DADOS logo abaixo.
   Digite apenas META e REALIZADO — porcentagens, "Faltam", meta total,
   barras, cores e selos são CALCULADOS AUTOMATICAMENTE.
   ##################################################################### */
/* =====================================================================
   DADOS — atualize aqui
   ===================================================================== */
const DADOS = /*==DADOS-INICIO==*/{
  titulo: "Painel Institucional — Matrículas 2026",
  subtitulo: "Colégio Marista Paranaense",
  atualizadoEm: "25/11/2026",
  // Digite só META e REALIZADO. Porcentagens, "Faltam" e o total são calculados sozinhos.
  rematricula: { meta: 2705, realizado: 2634 },
  novas:       { meta: 427,  realizado: 380  },

  // Ordem na tela: os 4 primeiros formam a coluna 1, os 4 seguintes a coluna 2.
  // somaNoTotal: true → o segmento entra na "Meta total de matrículas"
  segmentos: [
    { nome: "Educação Infantil", meta: 562,  realizado: 452,  somaNoTotal: true  },
    { nome: "Anos Iniciais",     meta: 746,  realizado: 709,  somaNoTotal: true  },
    { nome: "Anos Finais",       meta: 975,  realizado: 1039, somaNoTotal: true  },
    { nome: "Ensino Médio",      meta: 849,  realizado: 814,  somaNoTotal: true  },
    { nome: "NAC",               meta: 1510, realizado: 1300, somaNoTotal: false },
    { nome: "Integral",          meta: 215,  realizado: 180,  somaNoTotal: false },
    { nome: "Marista Idiomas",   meta: 290,  realizado: 135,  somaNoTotal: false },
    { nome: "Plus",              meta: 100,  realizado: 68,   somaNoTotal: false },
  ],
  // Mensagens do letreiro no rodapé. Deixe vazio [] para não passar nada.
  // Exemplo: avisos: ["Celebração de Natal dia 04/12 às 19h30", "Outra mensagem"],
  avisos: [
    "Celebração de Natal — 04/12, das 19h30 às 23h00, na Quadra G5",
       ],
}/*==DADOS-FIM==*/;
/* =====================================================================
   TELAS DO LOOP — adicione, remova ou reordene à vontade
   tipo:  "painel" → o painel de matrículas acima
          "imagem" → PNG/JPG (ex.: arte exportada do Canva)
          "video"  → MP4 (tempo: "fim" = troca quando o vídeo acaba)
          "site"   → qualquer página web (ex.: site do Canva)
          "aviso"  → tela de texto pronta, no visual do painel
   tempo: segundos na tela (60 = 1 minuto)
   cheia: true = ocupa a TV inteira (sem cabeçalho e rodapé)
   ajustar: true = imagem/vídeo preenche a tela cortando as bordas
   Dica: arquivos de imagem/vídeo podem ficar na mesma pasta do HTML
         (ex.: src:"campanha.png") ou ser um link https completo.
   ===================================================================== */
const TELAS = [
  { tipo: "painel", tempo: 120 },
  { tipo: "imagem", tempo: 60, src: "NATAL", cheia: true },   // Celebração de Natal (arte embutida no fim do arquivo)
  // { tipo: "imagem", tempo: 15, src: "campanha-irmaos.png", cheia: true },
  // { tipo: "video",  tempo: "fim", src: "institucional.mp4", cheia: true },
  // { tipo: "site",   tempo: 30, src: "https://maristapr.my.canva.site/mat26", cheia: true },
];

const AJUSTES = { destaqueSeg: 5, recarregarMin: 10, zoom: 0.98 };
// recarregarMin: a cada 10 min busca números novos
// zoom: tamanho do painel na tela (0.98 = 98%). Se a TV cortar as bordas, diminua (ex.: 0.96)
/* ===================================================================== */
</script>
<style>

<body>
<div id="stage">
  <header>
    <div class="brand"><img class="logo-img" id="logoImg" alt="Colégio Marista Paranaense"><span class="sep"></span>
      <div><h1 id="titulo"></h1></div></div>

  <div id="telas">
  <section class="tela" id="tela-painel">

    <div class="col">

            <circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="url(#gr)" stroke-width="11"
              stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"
              style="transition:stroke-dashoffset 2.2s cubic-bezier(.2,.8,.2,1)"/>
            <defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#6fb4ee"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
          </svg>

          <div class="h">Meta total de matrículas</div>
          <div class="nums">
            <div><div class="l">Meta</div><div class="v" data-n="meta">0</div></div>
            <div><div class="l">Realizado</div><div class="v" data-n="real">0</div></div>
            <div><div class="l">Faltam</div><div class="v f" data-n="falta">0</div></div>
          </div>
          <div class="bar"><i id="barTotal"></i></div>
          <div class="bar-l"><span id="barTxt"></span><span>Meta <b id="metaTxt"></b></span></div>
        </div>
      </section>

      <div class="pair">
        <section class="card mini dark" id="remat"></section>
        <section class="card mini" id="novas"></section>
      </div>

    <div class="col">
      <section class="card segs">
        <div class="segs-h"><div class="t">Andamento dos segmentos</div>
          <div class="legend"><span><i style="background:var(--ok)"></i>≥ 100%</span><span><i style="background:var(--sky)"></i>90–99%</span><span><i style="background:var(--warn)"></i>70–89%</span><span><i style="background:var(--low)"></i>&lt; 70%</span></div>

  </section>
  </div>

<!-- Vídeo minúsculo em loop: faz o Fire TV entender que há mídia tocando e não entrar em ociosidade -->
<video id="keepalive" muted playsinline loop autoplay></video>
<div id="iniciar"><div class="box"><div class="ok">OK</div>
  <h2>Pressione OK no controle para iniciar o painel</h2>
  <p>Só é preciso fazer isso uma vez. Depois, o painel roda sozinho e mantém a TV ativa.</p></div></div>

<script>

const $ = s => document.querySelector(s);
const nf = n => String(Math.round(n));
const pc = (r,m) => m ? r/m*100 : 0;
const pf = p => p.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%";
const cor = p => p>=100 ? "var(--ok)" : p>=90 ? "var(--sky)" : p>=70 ? "var(--warn)" : "var(--low)";

function contar(el, alvo, ms=1800){
  const t0 = performance.now();
  (function f(t){ const k = Math.min((t-t0)/ms,1), e = 1-Math.pow(1-k,3);
    el.textContent = nf(Math.round(alvo*e)); if(k<1) requestAnimationFrame(f); })(t0);
}

function render(){
  const D = DADOS;
  const somam = D.segmentos.filter(s=>s.somaNoTotal);
  const T = { meta: somam.reduce((a,s)=>a+(+s.meta||0),0), realizado: somam.reduce((a,s)=>a+(+s.realizado||0),0) };
  const pT = pc(T.realizado,T.meta);
  $("#titulo").textContent = D.titulo;
  $("#upd").textContent = "Atualizado em " + D.atualizadoEm;
  const v = {meta:T.meta, real:T.realizado, falta:Math.max(T.meta-T.realizado,0)};
  document.querySelectorAll("[data-n]").forEach(el=>contar(el, v[el.dataset.n]));
  $("#pTotal").textContent = Math.round(pT) + "%";
  $("#barTxt").innerHTML = "<b>" + pf(pT) + "</b> da meta atingida";
  $("#metaTxt").textContent = nf(T.meta);

  const mini = (titulo, o) => { const p = pc(o.realizado,o.meta);
    return `<div class="h">${titulo}</div>
      <div class="row2"><div><div class="l">Meta</div><div class="v">${nf(o.meta)}</div></div>
      <div><div class="l">Realizado</div><div class="v">${nf(o.realizado)}</div></div></div>
      <div class="foot"><span class="l">Já realizado</span><span class="p">${pf(p)}</span></div>
      <div class="sbar"><i data-w="${Math.min(p,100)}"></i></div>`; };
  $("#remat").innerHTML = mini("Rematrícula", D.rematricula);
  $("#novas").innerHTML = mini("Matrículas novas", D.novas);

  $("#grid").innerHTML = D.segmentos.map(({nome:n,realizado:r,meta:m})=>{ r=+r||0; m=+m||0; const p = pc(r,m);
    return `<div class="seg">
      <div class="top"><div class="n">${n}</div><div class="p" style="color:${p>=100?'var(--ok)':'var(--ink)'}">${pf(p)}</div></div>
      <div><div class="s"><span><b>${nf(r)}</b> realizados · meta ${nf(m)}</span>${p>=100?'<span class="badge">✓ META BATIDA</span>':''}</div>
      <div class="sbar"><i data-w="${Math.min(p,100)}" style="background:${cor(p)}"></i></div></div></div>`; }).join("");

  requestAnimationFrame(()=>setTimeout(()=>{
    $("#arc").style.strokeDashoffset = 326.7*(1-Math.min(pT,100)/100);
    $("#barTotal").style.width = Math.min(pT,100)+"%";
    document.querySelectorAll("[data-w]").forEach(b=>b.style.width = b.dataset.w+"%");
  },150));
}

/* ---------- Carrossel ---------- */
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function montarTelas(){
  const box = $("#telas"), painel = $("#tela-painel");
  painel.remove(); box.innerHTML = "";
  TELAS.forEach((t,i)=>{
    let el;
    if(t.tipo==="painel"){ el = painel; }
    else{
      el = document.createElement("section"); el.className = "tela";
      if(t.src==="NATAL") t.src = ARTE_NATAL;
      if(t.tipo==="imagem") el.innerHTML = `<div class="blur" style="background-image:url('${esc(t.src)}')"></div><img src="${esc(t.src)}" alt="">`;
      else if(t.tipo==="video") el.innerHTML = `<video src="${esc(t.src)}" muted playsinline preload="auto"></video>`;
      else if(t.tipo==="site") el.dataset.src = t.src;  // carrega só quando for exibir
      else if(t.tipo==="aviso") el.innerHTML = `<div class="aviso-t">${t.tag?`<span class="tg">${esc(t.tag)}</span>`:""}
          <h2>${esc(t.titulo)}</h2><p>${esc(t.texto)}</p></div>`;
    }
    if(t.cheia) el.classList.add("cheia");
    if(t.ajustar) el.classList.add("ajustar");
    box.appendChild(el);
  });
  $("#dots").innerHTML = TELAS.length>1 ? TELAS.map(()=>"<i></i>").join("") : "";
}

let atual = -1, t0 = 0, dur = 0, timer = null;
function mostrar(i){
  const els = document.querySelectorAll(".tela"), n = els.length; if(!n) return;
  const ant = els[atual]; atual = (i+n)%n;
  const t = TELAS[atual], el = els[atual];
  // pausa vídeo e descarrega site da tela anterior
  if(ant && ant!==el){ const v = ant.querySelector("video"); if(v) v.pause();
    if(ant.dataset.src) setTimeout(()=>{ if(!ant.classList.contains("on")) ant.innerHTML=""; }, 1000); }
  els.forEach(e=>e.classList.toggle("on", e===el));
  document.querySelectorAll(".dots i").forEach((d,k)=>d.classList.toggle("on",k===atual));
  if(t.tipo==="painel") reanimar();
  if(el.dataset.src && !el.querySelector("iframe")){
    const sep = el.dataset.src.includes("?")?"&":"?";
    el.innerHTML = `<iframe src="${esc(el.dataset.src+sep+"t="+Date.now())}" allow="autoplay; fullscreen"></iframe>`;
  }
  clearTimeout(timer);
  const v = el.querySelector("video");
  if(v){ v.currentTime = 0; v.play().catch(()=>{}); }
  if(t.tipo==="video" && t.tempo==="fim" && v){
    dur = 0; v.onended = ()=>mostrar(atual+1);
    v.onerror = ()=>mostrar(atual+1);
  } else {
    dur = (+t.tempo || 15)*1000; timer = setTimeout(()=>mostrar(atual+1), dur);
  }
  t0 = Date.now();
}
function reanimar(){
  document.querySelectorAll("#tela-painel [data-w]").forEach(b=>b.style.width="0");
  $("#arc").style.strokeDashoffset = 326.7; $("#barTotal").style.width = "0";
  render();
}
(function barra(){
  const els = document.querySelectorAll(".tela"), el = els[atual];
  const v = el && el.querySelector("video");
  const k = dur ? (Date.now()-t0)/dur : (v && v.duration ? v.currentTime/v.duration : 0);
  $("#prog").style.width = (TELAS.length>1 ? Math.min(k,1)*100 : 0) + "%";
  requestAnimationFrame(barra);
})();
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"){ mostrar(atual+1); e.preventDefault(); }
  if(e.key==="ArrowLeft"){ mostrar(atual-1); e.preventDefault(); }
});

/* Destaque rotativo nos segmentos (movimento suave na tela) */
let hi = -1;
setInterval(()=>{ const s = document.querySelectorAll(".seg"); if(!s.length) return;
  s.forEach(e=>e.classList.remove("hl")); hi = (hi+1)%s.length; s[hi].classList.add("hl");
}, AJUSTES.destaqueSeg*1000);

/* Letreiro */
let ai = 0;
function letreiro(){
  const el = $("#tk"), box = el.parentElement;
  if(!DADOS.avisos || !DADOS.avisos.length){ el.textContent = ""; setTimeout(letreiro, 60000); return; }
  el.textContent = DADOS.avisos[ai++ % DADOS.avisos.length];
  const dist = box.clientWidth + el.clientWidth, dur = dist / (box.clientWidth/14) * 1000;
  el.animate([{transform:"translate(0,-50%)"},{transform:`translate(${-dist}px,-50%)`}],{duration:dur,easing:"linear"})
    .onfinish = letreiro;
}

/* Relógio */
function tick(){ const d = new Date();
  $("#hora").textContent = d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  $("#data").textContent = d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"}); }

/* Anti-ociosidade */
let wl = null;
let liberado = false;
function liberar(){
  if(liberado) return; liberado = true;
  const v = $("#keepalive"); v.muted = false; v.volume = 1;   // a faixa de áudio é silenciosa
  v.play().catch(()=>{ v.muted = true; v.play().catch(()=>{}); });
  $("#iniciar").style.display = "none";
  if("mediaSession" in navigator){
    try{ navigator.mediaSession.metadata = new MediaMetadata({title:"Painel de Matrículas", artist:"Colégio Marista Paranaense"});
         navigator.mediaSession.playbackState = "playing"; }catch(e){}
  }
  acordado();
}
document.addEventListener("keydown", liberar, true);
document.addEventListener("click", liberar, true);
async function acordado(){
  try{ if("wakeLock" in navigator && !wl){ wl = await navigator.wakeLock.request("screen"); wl.onrelease = ()=>wl=null; } }catch(e){}
  const v = $("#keepalive"); if(liberado){ v.muted = false; v.volume = 1; } if(v.paused) v.play().catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) acordado(); });
document.addEventListener("keydown", acordado);
setInterval(acordado, 30000);
let ultimoT = -1;
setInterval(()=>{ const v = $("#keepalive"); if(v.currentTime===ultimoT){ v.load(); v.play().catch(()=>{}); } ultimoT = v.currentTime; }, 20000);
// Atualiza os DADOS sem recarregar a página (recarregar exigiria apertar OK de novo)
async function atualizarDados(){
  try{
    const txt = await (await fetch(location.pathname + "?t=" + Date.now(), {cache:"no-store"})).text();
    const a = txt.indexOf("/*==DADOS-INICIO==*/"), b = txt.indexOf("/*==DADOS-FIM==*/");
    if(a < 0 || b < 0) return;
    const novo = new Function("return " + txt.slice(a + 20, b))();
    if(novo && novo.segmentos){ Object.assign(DADOS, novo); if(TELAS[atual] && TELAS[atual].tipo==="painel") render(); }
  }catch(e){}
}
setInterval(atualizarDados, AJUSTES.recarregarMin*60000);

function iniciar(){
  $("#logoImg").src = LOGO_BRANCO;
  document.documentElement.style.setProperty("--zoom", AJUSTES.zoom || 1);
  $("#keepalive").src = VIDEO_KEEPALIVE;
  montarTelas(); mostrar(0); tick(); setInterval(tick,1000); letreiro(); acordado();
}
</script>
